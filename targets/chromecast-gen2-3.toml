# Chromecast 2nd/3rd generation: the disc with micro-USB power, 1080p output.
# Not the Ultra, which has USB-C and decodes HEVC. Provenance: see D27 and D35.

name = "chromecast-gen2-3"
device = "Chromecast gen 2/3, Plex receiver app, Plex Media Server on a Pi 4"

# One entry per FFprobe demuxer. See D29.
[containers.accepts]
# No QuickTime, M4A or 3GP file is recorded as played here, and each reads
# through the same demuxer as an MP4. The receiver app is fed by the server,
# and nobody has watched it take an MKV or a WebM directly.
assumed = ["mov,mp4,m4a,3gp,3g2,mj2", "matroska,webm"]

# AVI is left unlisted rather than rejected: it was measured stalling on the
# LG, and nothing has been tried here. An unlisted container is refused on an
# assumption, which is what that is.

[video]
max_bit_depth = { value = 8, source = "observed" }
max_height = { value = 1080, source = "assumed", note = "the device's output resolution; no downscale-on-decode has been tested" }
max_ref_frames = { value = 8, source = "assumed", observed_up_to = 5, note = "a 720p file with refs=5 direct-streamed; 8 is the decoder spec. A cap of 4 taken from the spec table produced false failures" }

[video.codecs.accepts]
observed = ["h264"]
assumed = ["vp8", "vp9"]

[video.pixel_formats.accepts]
observed = ["yuv420p"]
# yuvj420p is full-range 8-bit. Believed fine, never watched.
assumed = ["yuvj420p"]

[video.profiles]
h264.observed = ["baseline", "main", "high"]
h264.assumed = ["constrained baseline"]
vp9.assumed = ["profile 0"]
# vp8 has no profile concept, so it gets no entry rather than an empty one.

[video.max_level]
h264 = { value = 41, source = "observed" }

[audio]
max_channels = { value = 2, source = "assumed", note = "the receiver mixes to stereo; multichannel passthrough has not been tried" }

[audio.codecs.accepts]
observed = ["aac"]
assumed = ["mp3", "opus", "vorbis", "flac"]

[audio.codecs.rejects]
# Measured: the receiver app transcodes AC3 in every channel layout, stereo
# included. The LG panel decodes it; an envelope is per client.
observed = ["ac3"]
assumed = ["eac3", "dts", "truehd"]

[subtitles]
# The receiver renders text subtitles as an overlay. Image formats it cannot,
# so the server burns them in and re-encodes the video to do it.
burns_in.assumed = ["hdmv_pgs_subtitle", "dvd_subtitle", "dvb_subtitle"]
