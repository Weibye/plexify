# LG OLED65CX, webOS 5, alpha9 Gen3, running the Plex webOS app.
# No AV1: that arrived with the C1.
#
# `observed` was confirmed against a live Plex playback decision on this
# device. `assumed` is the specification, and is a belief that has never been
# tested. Do not promote a value from one to the other without a measurement.

name = "lg-cx-webos"
device = "LG CX OLED, Plex webOS app, Plex Media Server on a Pi 4"

[containers.accepts]
observed = ["mov", "mp4", "m4a", "matroska"]
assumed = ["webm"]

[containers.rejects]
# Measured, and not a decode failure: the app plays this video fine and then
# stalls ~48s mid-episode with the server at 0.5% CPU and nothing in flight,
# which is the client waiting on an index AVI does not carry up front. It is
# recorded as a rejection because that is what it costs to fix - a copy into
# MP4 - and a verdict the reader acts on cannot distinguish "refused" from
# "played badly".
observed = ["avi"]

[video]
max_bit_depth = { value = 10, source = "observed" }
max_height = { value = 2160, source = "assumed" }
max_ref_frames = { value = 16, source = "assumed" }

[video.codecs.accepts]
observed = ["h264", "hevc", "mpeg4"]
assumed = ["vp8", "vp9", "mpeg2video"]

[video.pixel_formats.accepts]
observed = ["yuv420p", "yuv420p10le"]
assumed = ["yuvj420p"]

[video.profiles]
h264.observed = ["baseline", "main", "high"]
h264.assumed = ["constrained baseline"]
hevc.observed = ["main", "main 10"]
vp9.assumed = ["profile 0", "profile 2"]

[video.max_level]
h264 = { value = 51, source = "assumed" }

[audio]
max_channels = { value = 6, source = "assumed" }

[audio.codecs.accepts]
observed = ["aac"]
# AC3 is the open question on this device: the Chromecast was measured
# rejecting it, and nobody has checked here.
assumed = ["mp3", "ac3", "eac3", "flac"]

[audio.codecs.rejects]
observed = ["opus"]
# LG dropped DTS decoding across the 2020 line.
assumed = ["dts", "truehd"]

[subtitles]
# Measured: the app burns these in rather than overlaying them, which forces a
# full video transcode and a downscale with it. mov_text is what plexify's own
# transcoder writes into every .mp4 it produces.
#
# webvtt was seen burned in a Critical Role session on this app. Read what that
# session can and cannot support: the video was ALREADY being transcoded in it
# (a VP9 source arriving as H.264), and a server that is transcoding anyway
# burns a text track cheaply. So "a webvtt track was burned here" is measured;
# "webvtt forces a burn" is not, and the two are not the same claim. The file
# also carried a `.en.vtt` sidecar, so which of the two was burned is unknown.
#
# Left as observed because it is the stronger of the two readings and this list
# decides whether a track leaves the container - being wrong towards taking the
# track out costs a sidecar nobody needed, being wrong the other way costs the
# transcode the Pi cannot sustain. Revisit when the discriminating playback is
# run; if it shows the burn was incidental to the video transcode, this belongs
# in `assumed` or nowhere.
burns_in.observed = ["mov_text", "webvtt"]
burns_in.assumed = ["hdmv_pgs_subtitle", "dvd_subtitle", "dvb_subtitle"]

# Deliberately absent: `ass` and `ssa`. 284 files carry them, and if a plain
# text format burns then styled text is at least as likely to - but nothing has
# watched it happen on this app, and adding it on the strength of the webvtt
# session would be inferring one belief from another rather than measuring it.
