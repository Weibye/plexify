# LG OLED65CX, webOS 5, alpha9 Gen3, running the Plex webOS app.
# No AV1: that arrived with the C1. Provenance: see D27 and D35.
#
# Every reading taken here before 2026-09-01 was taken with the app's own
# video quality set to "3 Mbps 720p", under which the server re-encodes every
# file whatever it holds. Readings since are at Original.

name = "lg-cx-webos"
device = "LG CX OLED, Plex webOS app, Plex Media Server on a Pi 4"

# One entry per FFprobe demuxer. See D29.
[containers.accepts]
# An MP4 and an MKV were watched Direct Playing (the AC3 and EAC3 sessions
# below). No QuickTime, M4A, 3GP or WebM file has been, and each reads through
# one of those two demuxers.
assumed = ["mov,mp4,m4a,3gp,3g2,mj2", "matroska,webm"]

[containers.rejects]
# Measured, and not a decode failure: the app plays this video and then stalls
# ~48s mid-episode with nothing in /status/sessions, which is the client
# waiting on an index AVI does not carry up front. A rejection, because the fix
# is the same as for one: a copy into MP4. The empty session list is what
# separates it from the client cap.
observed = ["avi"]

[video]
max_bit_depth = { value = 10, source = "observed" }
max_height = { value = 2160, source = "assumed" }
max_ref_frames = { value = 16, source = "assumed" }

[video.codecs.accepts]
observed = ["h264", "hevc", "mpeg4"]
assumed = ["vp8", "vp9", "mpeg2video"]

[video.pixel_formats.accepts]
observed = ["yuv420p", "yuv420p10le"]
assumed = ["yuvj420p"]

[video.profiles]
h264.observed = ["baseline", "main", "high"]
h264.assumed = ["constrained baseline"]
hevc.observed = ["main", "main 10"]
vp9.assumed = ["profile 0", "profile 2"]

[video.max_level]
h264 = { value = 51, source = "assumed" }

[audio]
# Nothing multichannel has been played on this app.
max_channels = { value = 6, source = "assumed", observed_up_to = 2, note = "the panel's decoder spec; the two AC3/EAC3 Direct Plays measured on 2026-09-01 were both 2-channel" }

[audio.codecs.accepts]
# AC3 and EAC3 measured 2026-09-01 at Original, read from /status/sessions:
# Fawlty Towers S01E01.mp4 (AC3 stereo) and Blackadder S01E01.mkv (EAC3 stereo)
# both reported `part decision = directplay` with the audio copied. The
# Chromecast receiver rejects AC3; an envelope is per client.
observed = ["aac", "ac3", "eac3"]
assumed = ["mp3", "flac"]

[audio.codecs.rejects]
# Measured as an Opus track transcoded to MP3 with the video copied, which is
# what separates it from the client cap.
observed = ["opus"]
# LG dropped DTS decoding across the 2020 line.
assumed = ["dts", "truehd"]

[subtitles]
# Nothing burns in. Both readings 2026-09-01 at Original:
# - Fawlty Towers S01E01.mp4: `part decision = directplay`, no video decision,
#   and its mov_text track `subtitleDecision = transcode` with `container =
#   srt`. A sidecar, with the picture copied.
# - Blackadder S01E01.mkv: `part decision = directplay`, HEVC and EAC3 copied,
#   and its PGS track `subtitleDecision = copy`. The app renders the bitmap.
#
# `webvtt` is untested: the only session that carried one was capped.
# `dvd_subtitle` and `dvb_subtitle` have no reading of their own; the belief
# that a client cannot overlay a bitmap is the one the PGS reading contradicts.
#
# Stated and empty, so that a grep for `burns_in` lands here.
burns_in = {}
