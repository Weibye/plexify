name: CI

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its base. Restricting this to `main` left
  # stacked pull requests with no checks at all until they were retargeted.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    strategy:
      matrix:
        rust: [stable]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    # The transcoding tests are the only check that every stream survives a
    # conversion, and they skip themselves when FFmpeg is missing. The runner
    # image does not carry it, so without this they would quietly never run -
    # which is why they refuse to skip when CI is set.
    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    # Some test results depend on the FFmpeg version (D26), so the log names it.
    - name: FFmpeg version
      run: ffmpeg -version

    - name: Cache cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ matrix.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.os }}-cargo-${{ matrix.rust }}-
          ${{ matrix.os }}-cargo-
          
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
      
  fmt:
    name: Format
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
        
    - name: Check formatting
      run: cargo fmt --all -- --check
      
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        
    - name: Cache cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ubuntu-latest-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ubuntu-latest-cargo-stable-
          ubuntu-latest-cargo-
          
    - name: Run clippy
      run: cargo clippy --all-targets --all-features

  # Every other job builds on the newest stable, so nothing else would notice a
  # dependency or a language feature that needs more than the `rust-version`
  # Cargo.toml promises. The version is read from there so it is stated once.
  oldest_rust:
    name: Oldest supported Rust
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Read rust-version
      id: rust_version
      run: |
        version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
        if [ -z "$version" ]; then
          echo "::error::Cargo.toml has no rust-version"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust_version.outputs.version }}

    - name: Cache cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ubuntu-latest-cargo-${{ steps.rust_version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ubuntu-latest-cargo-${{ steps.rust_version.outputs.version }}-

    # The claim is that the binary builds. The tests are left out because their
    # dev-dependencies need a newer Rust, as README says.
    - name: Check
      run: cargo check --locked

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest

    # rustsec/audit-check publishes its findings as a check run. Without these
    # it still fails the job correctly, but the advisories are only visible in
    # the raw log rather than as annotations.
    permissions:
      checks: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Security audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  pi_binary:
    name: Pi binary (aarch64 musl)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl

    - name: Cache cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ubuntu-latest-cargo-aarch64-musl-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ubuntu-latest-cargo-aarch64-musl-

    # No C cross-toolchain is installed and none is needed: every dependency is
    # pure Rust, so the bundled `rust-lld` links the whole thing. Wiring up
    # `aarch64-linux-musl-gcc` would be one more thing to keep working, for no
    # gain until something in the tree starts building C.
    - name: Build
      run: cargo build --release --target aarch64-unknown-linux-musl
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld

    # The whole point of choosing musl. A glibc build links against whatever
    # version the runner happens to carry and then refuses to start on a Pi
    # carrying an older one - a failure that would happen at the destination,
    # on someone else's machine, rather than here.
    - name: Refuse a binary that is not static
      run: |
        binary=target/aarch64-unknown-linux-musl/release/plexify
        file "$binary"
        readelf -h "$binary" | grep -E 'Class|Machine|Type'
        if readelf -l "$binary" | grep -q INTERP; then
          echo "::error::the binary names a dynamic loader, so it is not static"
          exit 1
        fi
        if readelf -d "$binary" 2>/dev/null | grep -q NEEDED; then
          echo "::error::the binary needs shared libraries, so it is not static"
          exit 1
        fi

    # `qemu-user` rather than `qemu-user-static`: on Ubuntu 26.04 the latter is
    # only a virtual package, and apt will not choose one of its providers.
    - name: Install qemu
      run: sudo apt-get update && sudo apt-get install -y qemu-user

    # Linking is not running. This executes the ARM64 binary on an x86 runner so
    # that "it builds" and "it starts" are two separate claims and the second
    # one has been seen to happen. It is emulation, not the hardware: it cannot
    # speak for the Pi's kernel or its FFmpeg, only for the binary itself.
    - name: Run it
      run: |
        binary=target/aarch64-unknown-linux-musl/release/plexify
        qemu-aarch64 "$binary" --version
        qemu-aarch64 "$binary" audit --help > /dev/null

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: plexify-aarch64-unknown-linux-musl
        path: target/aarch64-unknown-linux-musl/release/plexify
        if-no-files-found: error
